# Directioner-OS CI (guide §2.3, §4)
#
# Every push:
#   1. cargo test the Phase 0 capability layer + worklog
#   2. podman build the bootc image (rootful, so bootc-image-builder shares storage)
#   3. bootc-image-builder -> qcow2, with a disposable CI user injected for SSH
#   4. headless VM smoke test: boot the qcow2 (KVM if present, else TCG),
#      SSH in over user-mode networking, assert the custom motd and that
#      systemd reached running/degraded. Uses the guide's contract: "SSH in,
#      check a systemd unit is active".
name: Directioner-OS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      skip-vm-smoke:
        description: 'Skip the slow VM boot smoke test'
        type: boolean
        default: false

env:
  IMAGE_TAG: localhost/ai-os:ci

jobs:
  rust-tests:
    name: cargo test (capability-layer + worklog)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt check
        working-directory: ai-engineer
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: ai-engineer
        run: cargo clippy --workspace --all-targets -- -D warnings -A missing-docs
      - name: test
        working-directory: ai-engineer
        run: cargo test --workspace

  build-image:
    name: bootc image build + qcow2
    runs-on: ubuntu-24.04
    needs: rust-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Build OS image (rootful so the builder sees the same storage)
        working-directory: image
        run: |
          for attempt in 1 2 3; do
            echo "==> Podman build attempt $attempt of 3..."
            if sudo podman build --retry 3 --retry-delay 5s -t "${{ env.IMAGE_TAG }}" -f Containerfile .; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "==> Podman build failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done
          sudo podman images | grep ai-os
      - name: Emit qcow2 via bootc-image-builder (with CI user for SSH smoke test)
        working-directory: image
        run: |
          mkdir -p output
          PUBKEY="$(tr -d '\n' < ../vm-test/ci_key.pub)"
          cat > config.toml <<EOF
          [[customizations.user]]
          name = "ci"
          key = "${PUBKEY}"
          groups = ["wheel"]
          EOF
          echo '--- config.toml ---'; cat config.toml
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output":/output \
            -v "$(pwd)/config.toml":/config.toml:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --rootfs xfs --config /config.toml \
            "${{ env.IMAGE_TAG }}"
          ls -la output/qcow2/
      - name: Upload disk image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-os-qcow2
          path: image/output/qcow2/disk.qcow2
          if-no-files-found: error

  build-binaries:
    name: build release binaries
    runs-on: ubuntu-24.04
    needs: rust-tests
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: build release binaries
        working-directory: ai-engineer
        run: cargo build --release --workspace
      - name: Stage release binaries
        run: |
          mkdir -p dist_bin
          cp ai-engineer/target/release/ai-worldmodel dist_bin/
          cp ai-engineer/target/release/ai-benchmark dist_bin/
          cp ai-engineer/target/release/ai-capabilityd dist_bin/
          cp ai-engineer/target/release/ai-worklog dist_bin/
          cp ai-engineer/target/release/ai-engineer dist_bin/
          cp ai-engineer/target/release/ai-health dist_bin/
          cp ai-engineer/target/release/ai-cockpit dist_bin/
          ls -la dist_bin/
      - name: Upload release binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-binaries
          path: dist_bin/
          if-no-files-found: error

  vm-smoke:
    name: headless VM boot + SSH smoke test + world-model real sync + live rollback
    runs-on: ubuntu-24.04
    needs: [build-image, build-binaries]
    timeout-minutes: 50
    if: ${{ !(github.event.inputs['skip-vm-smoke'] == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - name: Download qcow2 artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-os-qcow2
          path: vm
      - name: Download release binaries artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-binaries
          path: vm/bin
      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
      - name: Boot image headlessly, wait for SSH, assert motd + systemd + live rollback
        run: |
          set -euo pipefail
          chmod 600 vm-test/ci_key
          ACCEL=tcg
          if [ -e /dev/kvm ] && [ -w /dev/kvm ]; then ACCEL=kvm; fi
          echo "==> accel: $ACCEL"

          qemu-img create -f qcow2 -F qcow2 \
            -b "$(pwd)/vm/disk.qcow2" vm/run.qcow2

          qemu-system-x86_64 \
            -machine accel=$ACCEL -cpu max -m 4096 -smp 4 \
            -drive file=vm/run.qcow2,format=qcow2,if=virtio \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=n0 \
            -display none \
            -serial file:vm/console.log \
            -pidfile vm/qemu.pid &
          QEMU_JOB_PID=$!
          cleanup() { kill $QEMU_JOB_PID 2>/dev/null || true; }
          trap cleanup EXIT

          SSH_OPTS="-i vm-test/ci_key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=5 -o BatchMode=yes"
          SCP_OPTS="-i vm-test/ci_key -P 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=5 -o BatchMode=yes"
          reachable=""
          for i in $(seq 1 180); do
            if ssh $SSH_OPTS ci@127.0.0.1 'echo up' 2>/dev/null | grep -q '^up$'; then
              reachable=yes
              echo "==> SSH reachable after ~$((i*10))s"
              break
            fi
            sleep 10
          done
          if [ -z "$reachable" ]; then
            echo '==> FAIL: VM never became SSH-reachable'
            tail -120 vm/console.log || true
            exit 1
          fi
          sleep 3

          ssh_cmd() {
            local max_attempts=5
            for attempt in $(seq 1 $max_attempts); do
              if ssh $SSH_OPTS ci@127.0.0.1 "$@"; then
                return 0
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep 2
              fi
            done
            return 1
          }

          echo '==> assertion 0: SELinux is active and enforcing in guest'
          SELINUX_MODE=$(ssh_cmd 'getenforce')
          echo "getenforce -> $SELINUX_MODE"
          [ "$SELINUX_MODE" = "Enforcing" ] || { echo "FAIL: SELinux must be Enforcing, got: $SELINUX_MODE"; exit 1; }
          ssh_cmd 'sudo dmesg | grep -i selinux | head -n 10' || true

          echo '==> assertion 1: custom motd is present'
          MOTD=$(ssh_cmd 'cat /etc/motd')
          echo "$MOTD"
          echo "$MOTD" | grep -q 'Hello from the AI-Native OS build' \
            || { echo 'FAIL: motd missing'; exit 1; }

          echo '==> assertion 2: systemd reached a healthy state'
          STATE=$(ssh_cmd 'systemctl is-system-running 2>/dev/null || true')
          echo "systemctl is-system-running -> ${STATE:-<empty>}"
          case "${STATE:-}" in
            running|degraded) ;;
            *) echo "FAIL: unexpected systemd state: ${STATE:-<empty>}"; exit 1 ;;
          esac

          echo '==> assertion 3: bootc tooling exists on the booted system'
          ssh_cmd 'command -v bootc && bootc --version' \
            || { echo 'FAIL: bootc not usable'; exit 1; }

          echo '==> assertion 4: deploy release binaries to /var/lib/ai-bin in the booted VM'
          ssh_cmd "sudo mkdir -p /var/lib/ai-bin"
          for b in ai-worldmodel ai-benchmark ai-capabilityd ai-worklog ai-engineer ai-health ai-cockpit; do
            BIN_PATH=$(find vm -name "$b" -type f | head -1)
            echo "deploying binary: $BIN_PATH -> /var/lib/ai-bin/$b"
            scp $SCP_OPTS "$BIN_PATH" ci@127.0.0.1:/tmp/$b
            ssh_cmd "sudo cp /tmp/$b /var/lib/ai-bin/$b && sudo chmod 755 /var/lib/ai-bin/$b && sudo chcon -t bin_t /var/lib/ai-bin/$b 2>/dev/null || true"
          done

          echo '==> assertion 5: run ai-worldmodel sync (rpm + systemctl) for real, inside the VM'
          sync_out=$(ssh_cmd '/var/lib/ai-bin/ai-worldmodel --db /tmp/wm.sqlite sync 2>&1')
          echo "$sync_out"
          ssh_cmd 'test -f /tmp/wm.sqlite && echo DB_CREATED' | grep -q DB_CREATED \
            || { echo 'FAIL: world-model sqlite DB not created'; exit 1; }

          echo '==> graph statistics (diagnostic)'
          stats_out=$(ssh_cmd '/var/lib/ai-bin/ai-worldmodel --db /tmp/wm.sqlite stats 2>&1')
          echo "$stats_out"
          echo "$stats_out" | grep -Eq 'packages=[1-9][0-9]* requires=[1-9][0-9]* provides=[1-9][0-9]* units=[0-9]+' \
            || { echo 'FAIL: world-model graph is empty (no requires/provides synced)'; exit 1; }

          echo '--> testing reverse dependencies on glibc & openssl-libs'
          dep_g_out=$(ssh_cmd '/var/lib/ai-bin/ai-worldmodel --db /tmp/wm.sqlite depends-on glibc 2>&1')
          echo "$dep_g_out"
          echo "$dep_g_out" | grep -q 'package(s) depend on glibc:' \
            || { echo 'FAIL: depends-on glibc returned no packages'; exit 1; }
          dep_o_out=$(ssh_cmd '/var/lib/ai-bin/ai-worldmodel --db /tmp/wm.sqlite depends-on openssl-libs 2>&1')
          echo "$dep_o_out"
          echo "$dep_o_out" | grep -q 'package(s) depend on openssl-libs:' \
            || { echo 'FAIL: depends-on openssl-libs returned no packages'; exit 1; }

          echo '==> assertion 6: failed-since returns structurally sane output'
          failed_out=$(ssh_cmd '/var/lib/ai-bin/ai-worldmodel --db /tmp/wm.sqlite failed-since 1h 2>&1')
          echo "$failed_out"
          echo "$failed_out" | grep -q 'unit failure(s) within 1h:' \
            || { echo 'FAIL: failed-since output not structurally valid'; exit 1; }

          echo '==> assertion 6.5: Phase 3.0.2 Health Model v1 query and crashloop detection'
          # Baseline healthy evaluation
          echo "evaluating baseline healthy state..."
          health_healthy=$(ssh_cmd '/var/lib/ai-bin/ai-health --db /tmp/wm.sqlite status')
          echo "$health_healthy"
          echo "$health_healthy" | grep -q 'HEALTHY' \
            || { echo 'FAIL: baseline health status is not HEALTHY'; exit 1; }

          # Inject a real crash-looping service in the guest
          echo "injecting real crash-looping service into guest..."
          ssh_cmd 'sudo bash -c "printf \"[Unit]\nDescription=Canary Crashloop Service\n[Service]\nType=simple\nRestart=always\nRestartSec=100ms\nExecStart=/usr/bin/false\n\" > /etc/systemd/system/canary-crashloop.service && systemctl daemon-reload && systemctl start canary-crashloop.service || true"'
          sleep 1

          # Sync world model to ingest the failure state transitions
          ssh_cmd '/var/lib/ai-bin/ai-worldmodel --db /tmp/wm.sqlite sync'

          # Evaluate degraded health with traceable evidence
          echo "evaluating health status with real crash-looping service..."
          health_degraded=$(ssh_cmd '/var/lib/ai-bin/ai-health --db /tmp/wm.sqlite status')
          echo "$health_degraded"
          health_json=$(ssh_cmd '/var/lib/ai-bin/ai-health --db /tmp/wm.sqlite status --json')
          echo "$health_json"

          echo "$health_degraded" | grep -q 'canary-crashloop.service' \
            || { echo 'FAIL: ai-health status failed to trace canary-crashloop.service in evidence'; exit 1; }
          echo "$health_json" | grep -q '"canary-crashloop.service"' \
            || { echo 'FAIL: ai-health status --json failed to include canary-crashloop.service'; exit 1; }

          # Clean up canary crashloop service
          ssh_cmd 'sudo systemctl stop canary-crashloop.service 2>/dev/null || true && sudo rm -f /etc/systemd/system/canary-crashloop.service && sudo systemctl daemon-reload'
          ssh_cmd '/var/lib/ai-bin/ai-worldmodel --db /tmp/wm.sqlite sync'

          echo '==> assertion 7: real live compensating rollback execution inside Fedora guest'
          # Create and start a real live systemd service in the guest
          ssh_cmd 'sudo bash -c "printf \"[Unit]\nDescription=Canary Rollback Test Service\n[Service]\nType=simple\nExecStart=/usr/bin/sleep 3600\n\" > /etc/systemd/system/canary-rollback.service && systemctl daemon-reload && systemctl start canary-rollback.service"'
          echo "checking live canary service is active..."
          ssh_cmd 'systemctl is-active canary-rollback.service' | grep -q '^active$' \
            || { echo 'FAIL: canary-rollback.service failed to start in VM'; exit 1; }

          # Start ai-capabilityd in LIVE mode (dry_run: false) inside the VM using systemd-run
          ssh_cmd 'sudo mkdir -p /tmp/live-scope'
          ssh_cmd 'sudo systemd-run --unit=live-capabilityd /var/lib/ai-bin/ai-capabilityd --socket /tmp/live-cap.sock --audit-log /var/log/live-worklog.jsonl --lock-file /tmp/live-killswitch.lock --work-root /tmp/live-scope --exec'

          # Wait up to 10 seconds for socket to become ready
          ready=""
          for i in $(seq 1 20); do
            if ssh_cmd 'sudo chmod 666 /tmp/live-cap.sock /var/log/live-worklog.jsonl 2>/dev/null && test -S /tmp/live-cap.sock'; then
              ready=yes
              echo "ai-capabilityd live socket ready"
              break
            fi
            sleep 0.5
          done
          if [ -z "$ready" ]; then
            echo 'FAIL: ai-capabilityd live socket not ready'
            ssh_cmd 'sudo journalctl -u live-capabilityd -n 50 --no-pager || true'
            exit 1
          fi

          ssh $SSH_OPTS ci@127.0.0.1 python3 < vm-test/test_live_caps.py

          echo '==> assertion 8: run in-guest benchmark suite asserting RollbackPendingReboot end-to-end'
          bench_out=$(ssh_cmd '/var/lib/ai-bin/ai-benchmark')
          echo "$bench_out"
          echo "$bench_out" | grep -q 'package_service_compensating_rollback │  PASS ' \
            || { echo 'FAIL: package_service_compensating_rollback scenario failed in live guest'; exit 1; }

          # ------------------------------------------------------------------------------------------------
          # Phase 3.0.1: Genuine A/B Boot Slot Pinning + Tier 1 Automatic Rollback Verification (Spec §1, §4)
          # ------------------------------------------------------------------------------------------------
          echo '==> assertion 9: Phase 3.0.1 Genuine A/B boot slot mechanics & Tier 1 Automatic Rollback'

          # 9.1 Pin the current good deployment (deployment 0) via live capability daemon
          ssh $SSH_OPTS ci@127.0.0.1 python3 < vm-test/pin_boot_slot.py

          echo "verifying deployment 0 is pinned before modification..."
          initial_ostree=$(ssh_cmd 'sudo ostree admin status')
          echo "$initial_ostree"
          echo "$initial_ostree" | grep -q 'Pinned: yes' \
            || { echo 'FAIL: deployment 0 was not pinned'; exit 1; }

          # 9.2 Verify greenboot required health check and directioner-milestone service in the guest
          echo "verifying baked greenboot health check and milestone service in guest..."
          ssh_cmd 'test -x /etc/greenboot/check/required.d/01_directioner_milestone.sh && systemctl is-active directioner-milestone.service' \
            || { echo 'FAIL: greenboot required milestone check or service is not active in guest'; exit 1; }

          # 9.3 Stage a new deployment with a real broken required service drop-in override
          echo "staging broken service drop-in override causing real service failure on reboot..."
          ssh_cmd 'sudo mkdir -p /etc/systemd/system/directioner-milestone.service.d && printf "[Service]\nExecStart=\nExecStart=/usr/bin/false\n" | sudo tee /etc/systemd/system/directioner-milestone.service.d/fault.conf && sudo grub2-editenv /boot/grub2/grubenv set boot_counter=3 2>/dev/null || true && sudo rpm-ostree kargs --append-if-missing="directioner.stage=corrupted_deployment"'

          # 9.4 Initiate reboot into the staged broken deployment
          echo "rebooting VM into broken deployment; greenboot health check will fail on real service non-zero exit and trigger Tier 1 automatic rollback..."
          ssh_cmd 'sudo systemctl reboot' || true

          # 9.5 Wait for the VM to reboot through greenboot failure cycles until it recovers into pinned deployment 0
          echo "waiting for Tier 1 greenboot to exhaust retry cycles and recover into pinned deployment 0..."
          sleep 20
          recovered=""
          for i in $(seq 1 180); do
            top_status=$(ssh $SSH_OPTS ci@127.0.0.1 'sudo ostree admin status 2>/dev/null' 2>/dev/null || true)
            if [ -n "$top_status" ]; then
              active_pinned=$(echo "$top_status" | awk '/^\*/ {p=1; next} /^  / && p {if ($0 ~ /Pinned: yes/) print "yes"; p=0}' || true)
              if [ "$active_pinned" = "yes" ]; then
                recovered=yes
                echo "==> VM successfully completed greenboot retry cycles and recovered into pinned deployment 0 after ~$((i*5 + 20))s"
                break
              else
                if [ $((i % 6)) -eq 0 ]; then
                  echo "poll #$i (~$((i*5 + 20))s): early boot greenboot failure retry in progress..."
                fi
              fi
            fi
            sleep 5
          done
          if [ -z "$recovered" ]; then
            echo '==> FAIL: VM never recovered into pinned deployment 0 via Tier 1 automatic rollback'
            tail -150 vm/console.log || true
            exit 1
          fi

          # 9.6 Explicit Assertion 9.1: Assert active booted deployment is the pinned good deployment
          echo "asserting active booted deployment after automatic rollback..."
          recovered_ostree=$(ssh_cmd 'sudo ostree admin status')
          echo "$recovered_ostree"
          echo "$recovered_ostree" | awk '/^\*/ {p=1; next} /^  / && p {if ($0 ~ /Pinned: yes/) print "yes"; p=0}' | grep -q 'yes' \
            || { echo 'FAIL: active booted deployment after recovery is not the pinned deployment 0'; exit 1; }

          # 9.7 Explicit Assertion 9.2: Assert NO test script or control plane called bootc_rollback capability
          echo "asserting that NO manual bootc.rollback capability call was invoked by any script..."
          worklog_audit=$(ssh_cmd '/var/lib/ai-bin/ai-worklog --log /var/log/live-worklog.jsonl tail --lines 50')
          echo "$worklog_audit"
          if echo "$worklog_audit" | grep -q 'bootc.rollback'; then
            echo 'FAIL: bootc.rollback was invoked via capability daemon! Rollback must happen at the boot-watchdog layer below user-space.'
            exit 1
          else
            echo "CONFIRMED: zero bootc.rollback capability calls dispatched during recovery. Rollback occurred automatically at boot-watchdog layer."
          fi

          # 9.8 Explicit Assertion 9.3: Record post-boot Tier 1 rollback observation to Work Log (Spec §1)
          echo "recording post-boot Tier 1 rollback observation to Work Log..."
          ssh $SSH_OPTS ci@127.0.0.1 python3 < vm-test/record_rollback_worklog.py

          final_log=$(ssh_cmd '/var/lib/ai-bin/ai-worklog --log /var/log/live-worklog.jsonl tail --lines 5')
          echo "$final_log"
          echo "$final_log" | grep -q 'boot_watchdog.tier1_rollback_observed' \
            || { echo 'FAIL: post-boot Tier 1 rollback observation missing from Work Log'; exit 1; }

          # 9.9 Explicit Assertion 9.4: Assert Health Model evaluates post-boot Tier 1 rollback observation as DEGRADED with traceable evidence
          echo "evaluating Health Model status on recovered deployment after Tier 1 rollback..."
          postboot_health=$(ssh_cmd '/var/lib/ai-bin/ai-health --db /tmp/wm.sqlite --worklog /var/log/live-worklog.jsonl status')
          echo "$postboot_health"
          postboot_json=$(ssh_cmd '/var/lib/ai-bin/ai-health --db /tmp/wm.sqlite --worklog /var/log/live-worklog.jsonl status --json')
          echo "$postboot_json"
          echo "$postboot_health" | grep -q 'Tier 1 autonomous rollback' \
            || { echo 'FAIL: Health Model did not detect Tier 1 rollback observation in boot subsystem'; exit 1; }
          echo "$postboot_json" | grep -q '"name": "boot"' \
            || { echo 'FAIL: Health Model json missing boot subsystem'; exit 1; }

          # Also test Operational Cockpit query in the live VM
          echo "testing ai-cockpit snapshot on recovered deployment..."
          cockpit_out=$(ssh_cmd '/var/lib/ai-bin/ai-cockpit --db /tmp/wm.sqlite --audit /var/log/live-worklog.jsonl --json')
          echo "$cockpit_out"
          echo "$cockpit_out" | grep -q '"health_report"' \
            || { echo 'FAIL: ai-cockpit snapshot missing health_report'; exit 1; }

          # ------------------------------------------------------------------------------------------------
          # Phase 3.0.4: Tier 2 Kernel Parameter Tuning & Module Loading In-Guest Verification (Spec §4)
          # ------------------------------------------------------------------------------------------------
          echo '==> assertion 10: Phase 3.0.4 Tier 2 kernel sysctl tuning + module remediation + refcount guard'
          ssh_cmd 'sudo mkdir -p /tmp/live-scope && sudo systemd-run --unit=live-capabilityd /var/lib/ai-bin/ai-capabilityd --socket /tmp/live-cap.sock --audit-log /var/log/live-worklog.jsonl --lock-file /tmp/live-killswitch.lock --work-root /tmp/live-scope --exec 2>/dev/null || true'
          for i in $(seq 1 20); do
            if ssh_cmd 'sudo chmod 666 /tmp/live-cap.sock /var/log/live-worklog.jsonl 2>/dev/null && test -S /tmp/live-cap.sock'; then
              echo "ai-capabilityd live socket ready for Assertion 10"
              break
            fi
            sleep 0.5
          done

          ssh $SSH_OPTS ci@127.0.0.1 python3 < vm-test/test_phase3_tier2_caps.py

          # ------------------------------------------------------------------------------------------------
          # Phase 3.1: Closed-Loop Self-Healing & Automated Remediation In-Guest Verification (Spec §4)
          # ------------------------------------------------------------------------------------------------
          echo '==> assertion 11: Phase 3.1 Closed-loop Self-Healing & Automated Remediation'
          ssh $SSH_OPTS ci@127.0.0.1 python3 < vm-test/test_phase3_self_healing.py

          echo '==> END TO END PASS (Phase 3.0.1, 3.0.2, 3.0.3, 3.0.4, 3.1 Boot Mechanics + Health Model + Self-Healing Verified)'
      - name: Upload console log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vm-console-log
          path: vm/console.log