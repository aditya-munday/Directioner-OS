name: Runner Environment & KVM Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe KVM & System Specs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Raw hardware & KVM inspection
        run: |
          echo "=== 1. Initial State ==="
          ls -l /dev/kvm || true
          id
          grep -c -E 'vmx|svm' /proc/cpuinfo || true
          uname -r
          nproc
          free -h
          df -h

      - name: Apply hosted runner udev / permissions rule
        run: |
          echo "=== 2. Applying udev rule & permissions ==="
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          else
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
          fi
          ls -l /dev/kvm || true

      - name: Verify KVM acceleration availability
        run: |
          echo "=== 3. KVM acceleration check ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpu-checker qemu-system-x86
          kvm-ok || true
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "ACCEL_RESULT=kvm"
          else
            echo "ACCEL_RESULT=tcg"
          fi
