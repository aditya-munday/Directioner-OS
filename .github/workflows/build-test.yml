# Directioner-OS CI (guide §2.3, §4)
#
# Every push:
#   1. cargo test the Phase 0 capability layer + worklog
#   2. podman build the bootc image (rootful, so bootc-image-builder shares storage)
#   3. bootc-image-builder -> qcow2, with a disposable CI user injected for SSH
#   4. headless VM smoke test: boot the qcow2 (KVM if present, else TCG),
#      SSH in over user-mode networking, assert the custom motd and that
#      systemd reached running/degraded. Uses the guide's contract: "SSH in,
#      check a systemd unit is active".
name: build-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      skip-vm-smoke:
        description: 'Skip the slow VM boot smoke test'
        type: boolean
        default: false

env:
  IMAGE_TAG: localhost/ai-os:ci

jobs:
  rust-tests:
    name: cargo test (capability-layer + worklog)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt check
        working-directory: ai-engineer
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: ai-engineer
        run: cargo clippy --workspace --all-targets -- -D warnings -A missing-docs
      - name: test
        working-directory: ai-engineer
        run: cargo test --workspace

  build-image:
    name: bootc image build + qcow2
    runs-on: ubuntu-24.04
    needs: rust-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Build OS image (rootful so the builder sees the same storage)
        working-directory: image
        run: |
          sudo podman build -t "${{ env.IMAGE_TAG }}" -f Containerfile .
          sudo podman images | grep ai-os
      - name: Emit qcow2 via bootc-image-builder (with CI user for SSH smoke test)
        working-directory: image
        run: |
          mkdir -p output
          PUBKEY="$(tr -d '\n' < ../vm-test/ci_key.pub)"
          cat > config.toml <<EOF
          [[customizations.user]]
          name = "ci"
          key = "${PUBKEY}"
          groups = ["wheel"]
          EOF
          echo '--- config.toml ---'; cat config.toml
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$(pwd)/output":/output \
            -v "$(pwd)/config.toml":/config.toml:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --rootfs xfs --config /config.toml \
            "${{ env.IMAGE_TAG }}"
          ls -la output/qcow2/
      - name: Upload disk image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-os-qcow2
          path: image/output/qcow2/disk.qcow2
          if-no-files-found: error

  build-worldmodel:
    name: build world-model binary
    runs-on: ubuntu-24.04
    needs: rust-tests
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: build release binary
        working-directory: ai-engineer
        run: |
          cargo build --release -p world-model
          ls -la target/release/ai-worldmodel
      - name: Upload world-model binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-worldmodel-bin
          path: ai-engineer/target/release/ai-worldmodel
          if-no-files-found: error

  vm-smoke:
    name: headless VM boot + SSH smoke test + world-model real sync
    runs-on: ubuntu-24.04
    needs: [build-image, build-worldmodel]
    timeout-minutes: 50
    if: ${{ !(github.event.inputs.skip-vm-smoke == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - name: Download qcow2 artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-os-qcow2
          path: vm
      - name: Download world-model binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-worldmodel-bin
          path: vm
      - name: Install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
      - name: Boot image headlessly, wait for SSH, assert motd + systemd
        run: |
          set -euo pipefail
          chmod 600 vm-test/ci_key
          ACCEL=tcg
          if [ -e /dev/kvm ] && [ -w /dev/kvm ]; then ACCEL=kvm; fi
          echo "==> accel: $ACCEL"

          qemu-img create -f qcow2 -F qcow2 \
            -b "$(pwd)/vm/disk.qcow2" vm/run.qcow2

          qemu-system-x86_64 \
            -machine accel=$ACCEL -cpu max -m 4096 -smp 4 \
            -drive file=vm/run.qcow2,format=qcow2,if=virtio \
            -netdev user,id=n0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=n0 \
            -display none \
            -serial file:vm/console.log \
            -pidfile vm/qemu.pid &
          QEMU_JOB_PID=$!
          cleanup() { kill $QEMU_JOB_PID 2>/dev/null || true; }
          trap cleanup EXIT

          SSH_OPTS="-i vm-test/ci_key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o BatchMode=yes"
          SCP_OPTS="-i vm-test/ci_key -P 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o BatchMode=yes"
          reachable=""
          for i in $(seq 1 150); do
            if ssh $SSH_OPTS ci@127.0.0.1 'echo up' 2>/dev/null | grep -q '^up$'; then
              reachable=yes
              echo "==> SSH reachable after ~$((i*10))s"
              break
            fi
            sleep 10
          done
          if [ -z "$reachable" ]; then
            echo '==> FAIL: VM never became SSH-reachable'
            tail -120 vm/console.log || true
            exit 1
          fi

          ssh_cmd() {
            ssh $SSH_OPTS ci@127.0.0.1 "$@"
          }

          echo '==> assertion 1: custom motd is present'
          MOTD=$(ssh_cmd 'cat /etc/motd')
          echo "$MOTD"
          echo "$MOTD" | grep -q 'Hello from the AI-Native OS build' \
            || { echo 'FAIL: motd missing'; exit 1; }

          echo '==> assertion 2: systemd reached a healthy state'
          STATE=$(ssh_cmd 'systemctl is-system-running 2>/dev/null || true')
          echo "systemctl is-system-running -> ${STATE:-<empty>}"
          case "${STATE:-}" in
            running|degraded) ;;
            *) echo "FAIL: unexpected systemd state: ${STATE:-<empty>}"; exit 1 ;;
          esac

          echo '==> assertion 3: bootc tooling exists on the booted system'
          ssh_cmd 'command -v bootc && bootc --version' \
            || { echo 'FAIL: bootc not usable'; exit 1; }

          echo '==> assertion 4: deploy ai-worldmodel to the booted VM and sync against real data'
          if [ -f vm/ai-worldmodel ]; then
            WM_BIN=vm/ai-worldmodel
          elif [ -f vm/ai-worldmodel-bin/ai-worldmodel ]; then
            WM_BIN=vm/ai-worldmodel-bin/ai-worldmodel
          else
            WM_BIN=$(find vm -name ai-worldmodel -type f | head -1)
          fi
          echo "deploying binary: $WM_BIN"
          scp $SCP_OPTS "$WM_BIN" ci@127.0.0.1:/tmp/ai-worldmodel
          ssh_cmd 'chmod +x /tmp/ai-worldmodel'

          echo '==> run ai-worldmodel sync (dnf5 + systemctl) for real, inside the VM'
          sync_out=$(ssh_cmd '/tmp/ai-worldmodel --db /tmp/wm.sqlite sync 2>&1')
          echo "$sync_out"
          ssh_cmd 'test -f /tmp/wm.sqlite && echo DB_CREATED' | grep -q DB_CREATED \
            || { echo 'FAIL: world-model sqlite DB not created'; exit 1; }

          echo '==> assertion 5: reverse dependency queries return real, non-empty results'
          echo '--> testing depends-on glibc'
          glibc_out=$(ssh_cmd '/tmp/ai-worldmodel --db /tmp/wm.sqlite depends-on glibc 2>&1')
          echo "$glibc_out"
          echo "$glibc_out" | grep -Eq '^[1-9][0-9]* package\(s\) depend on glibc:' \
            || { echo 'FAIL: depends-on glibc returned no packages'; exit 1; }

          echo '--> testing depends-on openssl-libs'
          openssl_out=$(ssh_cmd '/tmp/ai-worldmodel --db /tmp/wm.sqlite depends-on openssl-libs 2>&1')
          echo "$openssl_out"
          echo "$openssl_out" | grep -Eq '^[1-9][0-9]* package\(s\) depend on openssl-libs:' \
            || { echo 'FAIL: depends-on openssl-libs returned no packages'; exit 1; }

          echo '==> assertion 6: failed-since returns structurally sane output'
          failed_out=$(ssh_cmd '/tmp/ai-worldmodel --db /tmp/wm.sqlite failed-since 1h 2>&1')
          echo "$failed_out"
          echo "$failed_out" | grep -Eq '^[0-9]+ unit failure\(s\) within 1h:' \
            || { echo 'FAIL: failed-since output not structurally valid'; exit 1; }

          echo '==> END TO END PASS (motd + systemd + bootc + world-model sync + real queries verified)'
      - name: Upload console log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vm-console-log
          path: vm/console.log
