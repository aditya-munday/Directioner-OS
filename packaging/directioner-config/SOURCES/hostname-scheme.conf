# Directioner OS — Hostname Scheme Configuration (TODO 083)
# Used by OOBE (first-boot) and directioner-accountd for hostname generation.
#
# Default hostname format: directioner-<random4>
# where <random4> is a 4-character lowercase alphanumeric string.
# Example: directioner-x7k2
#
# The user may override this in the OOBE wizard or via:
#   hostnamectl set-hostname <name>

[hostname]
scheme   = "prefix-random"
prefix   = "directioner"
length   = 4
charset  = "abcdefghijklmnopqrstuvwxyz0123456789"
separator = "-"

# User override is always allowed. This config sets the INITIAL hostname only.
allow_user_override = true

# NTP is ON by default (Rule E: safe, reasonable default)
[time]
ntp_enabled  = true
ntp_servers  = ["time.cloudflare.com", "pool.ntp.org"]
timezone_default = "UTC"

# Locale defaults (user selects at OOBE)
[locale]
default_lang   = "en_US.UTF-8"
default_locale = "en_US.UTF-8"
fallback_lang  = "C.UTF-8"
