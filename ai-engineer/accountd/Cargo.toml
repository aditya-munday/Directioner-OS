[package]
name = "accountd"
description = "Directioner OS Account Daemon and Client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "directioner-accountd"
path = "src/bin/accountd.rs"

[[bin]]
name = "dos-account"
path = "src/bin/dos-account.rs"

[lints.rust]
missing_docs = "allow"
