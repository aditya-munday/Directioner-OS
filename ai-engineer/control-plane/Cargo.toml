[package]
name = "control-plane"
description = "Directioner-OS AI Engineer Control Plane: Planner, Implementer, Blast-Radius Policy Engine & Dry-Run Simulator (Phase 1.2/1.3/1.5)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
capability-layer = { path = "../capability-layer" }
world-model = { path = "../world-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
parking_lot = "0.12"

[[bin]]
name = "ai-engineer"
path = "src/bin/ai-engineer.rs"

[[bin]]
name = "ai-cockpit"
path = "src/bin/ai-cockpit.rs"

[[bin]]
name = "ai-health"
path = "src/bin/ai-health.rs"

[[bin]]
name = "ai-hwcheck"
path = "src/bin/ai-hwcheck.rs"

[lints]
workspace = true

