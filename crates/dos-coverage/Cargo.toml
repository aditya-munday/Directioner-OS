[package]
name = "dos-coverage"
description = "Directioner OS Introspection Coverage and CI Quality Gate Tool (U087, U088)"
workspace = "../../ai-engineer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
dos-catalog = { path = "../dos-catalog" }
dosctl = { path = "../dosctl" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "dos-coverage"
path = "src/main.rs"

[lints.rust]
missing_docs = "allow"
