[package]
name = "directioner-os-mcp"
description = "Directioner OS Model Context Protocol Server (U082, U083)"
workspace = "../../ai-engineer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
dos-catalog = { path = "../dos-catalog" }
directioner-statd = { path = "../directioner-statd" }
directioner-actd = { path = "../directioner-actd" }
dosctl = { path = "../dosctl" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "directioner-os-mcp"
path = "src/main.rs"

[lints.rust]
missing_docs = "allow"
