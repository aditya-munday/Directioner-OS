[package]
name = "directioner-statd"
description = "Directioner OS Observe Plane Daemon (U065-U069)"
workspace = "../../ai-engineer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "directioner-statd"
path = "src/main.rs"

[lints.rust]
missing_docs = "allow"
